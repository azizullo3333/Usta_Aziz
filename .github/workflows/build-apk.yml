name: APK yig'ish

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip'ni ochish
        run: unzip -o Usta_Aziz.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK yig'ish
        working-directory: Usta_Aziz
        run: gradle assembleRelease --no-daemon

      - name: APK nomini o'zgartirish
        run: cp Usta_Aziz/app/build/outputs/apk/release/app-release.apk Usta_Aziz.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Usta_Aziz-apk
          path: Usta_Aziz.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Usta_Aziz v${{ github.run_number }}
          files: Usta_Aziz.apk
